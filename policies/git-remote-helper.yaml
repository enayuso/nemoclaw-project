preset:
  name: git-remote-helper
  description: "Allow git's internal remote-transport helper binaries to reach github.com over HTTPS (git itself is allowed by the brew preset, but its git-remote-http/https child process is not) NOTE 2026-09-03 (nemoclaw v0.0.109 / OpenShell 0.0.101 upgrade): dropped this preset's tls: skip on the github.com/api.github.com endpoints - OpenShell now fails closed (\"network endpoint ambiguity validation failed\") when two policies target the same host:port with conflicting tls metadata, and both the built-in 'brew' and 'github' presets already cover these same hosts with the implicit tls: auto default. This preset still exists only to add binary-specific access (the child binaries below), not to change the TLS handling those other presets already established."

network_policies:
  git_remote_helper:
    name: git_remote_helper
    endpoints:
      - host: github.com
        port: 443
        access: full
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/lib/git-core/git-remote-https }
