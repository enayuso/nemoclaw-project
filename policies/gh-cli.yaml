preset:
  name: gh-cli
  description: "Allow the gh CLI binary to reach github.com and api.github.com over HTTPS - the built-in 'github' preset already allows both hosts but only for /usr/bin/git (NemoClaw's policy enforcement is binary-aware, not just host/port-aware), so gh itself is blocked without this. Confirmed live 2026-08-03: 'gh auth login --with-token' failed with a 403 network-policy denial against api.github.com until this was added. NOTE 2026-09-03 (nemoclaw v0.0.109 / OpenShell 0.0.101 upgrade): dropped this preset's tls: skip on the github.com/api.github.com endpoints - OpenShell now fails closed (\"network endpoint ambiguity validation failed\") when two policies target the same host:port with conflicting tls metadata, and both the built-in 'brew' and 'github' presets already cover these same hosts with the implicit tls: auto default. This preset still exists only to add binary-specific access (the child binaries below), not to change the TLS handling those other presets already established."

network_policies:
  gh_cli:
    name: gh_cli
    endpoints:
      - host: github.com
        port: 443
        access: full
      - host: api.github.com
        port: 443
        access: full
    binaries:
      - { path: /usr/local/bin/gh }
